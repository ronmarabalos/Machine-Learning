name: retrain

on:
  workflow_dispatch:  # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [scripts/train_categorizer.py, scripts/generate_fake_data.py, service/clean.py]

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to push the new model
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      # data/ never leaves my machine; the generator is seeded, so CI rebuilds the identical file
      - run: python ../scripts/generate_fake_data.py
      - run: python ../scripts/train_categorizer.py  # fails the job if accuracy < 90%
      - run: python -m pytest tests -q  # tests now load the freshly trained model
      - uses: actions/upload-artifact@v5
        with:
          name: categorizer
          path: service/model/categorizer.joblib
      # Vercel redeploys service/ on every push to main, so committing the model is the deploy.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit new model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/categorizer.joblib
          git diff --cached --quiet && echo "Model unchanged, nothing to deploy" && exit 0
          git commit -m "Retrain categorizer (CI run ${{ github.run_id }})"
          git push
